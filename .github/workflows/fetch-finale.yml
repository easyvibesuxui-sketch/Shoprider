name: Fetch Kling asset

# Kling result URLs expire after 24 h, so finished assets (the finale cutscene,
# the preloader loop) are copied into the repo. Run by hand with the URL.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Kling result URL
        required: true
      path:
        description: Where to save it in the repo
        required: false
        default: public/video/finale.mp4

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.path }}
        run: |
          case "$DEST" in public/*|art/*) ;; *) echo "path must be under public/ or art/"; exit 1;; esac
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL "$URL" -o "$DEST"
          file "$DEST"
          ls -la "$DEST"
      - name: Commit
        env:
          DEST: ${{ inputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Add Kling asset $DEST" || echo "no change"
          git push
